name: Build & Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint & Type check
        # ruff（代码风格/bug 面）+ mypy（类型）门禁：失败即中断发版，
        # 防止未达标的改动进入 Release（本地用同样命令验证：
        # ruff check src tests scripts main.py；mypy src）。
        run: |
          uv run ruff check src tests scripts main.py
          uv run mypy src

      - name: Test
        # pytest 门禁：单测（core 纯逻辑 / GUI 冒烟 / updater 等）全绿才发版，
        # 防止失败用例混入 Release（本地用同样命令验证）。
        # --timeout 依赖 dev 组 pytest-timeout：防 runner 上某个测试无限挂起
        # （如 GUI 冒烟在会话环境下卡住），超时即失败并输出挂起测试名，便于定位。
        run: uv run pytest -q --timeout=120

      - name: Inject version from tag
        # 发版 tag（如 v1.0.1）自动写入 __version__，无需手动同步版本号；
        # 直接调用 uv sync 已创建的 .venv python，避免依赖 uv run 的项目解析
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/inject_version.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- diagnostics ---"
            Write-Host "ref: $env:GITHUB_REF_NAME"
            Test-Path scripts/inject_version.py
            exit $LASTEXITCODE
          }

      - name: Install UPX
        # UPX 压缩 exe（spec 已置 upx=True，PyInstaller 自动从 PATH 发现 upx；
        # 不装则静默跳过压缩）。版本与本地构建保持一致。
        # 用 curl.exe 下载（Windows 自带）：-f 失败即非零退出、--retry 网络重试；
        # GITHUB_PATH 只影响后续步骤，本步骤内用完整路径直接验证。
        shell: pwsh
        run: |
          $upxVersion = "4.2.4"
          $upxDir = "$env:RUNNER_TEMP\upx"
          $zip = "$env:RUNNER_TEMP\upx.zip"
          $url = "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip"
          curl.exe -L -f --retry 3 --retry-delay 2 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "UPX 下载失败，curl 退出码 $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath $upxDir -Force
          $upxExe = "$upxDir\upx-$upxVersion-win64\upx.exe"
          if (-not (Test-Path $upxExe)) { throw "解压后未找到 upx.exe: $upxExe" }
          & $upxExe --version | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value "$upxDir\upx-$upxVersion-win64" -Encoding ascii
          Write-Host "UPX 已安装: $upxExe"

      - name: Build EXE
        # spec 输出名即 Release 资产名（CADBatchAssistant.exe），本地与 CI 产物一致。
        # UPX 由前一步安装到 runner.temp（path-upx 目录已加入 PATH，PyInstaller upx=True
        # 自动发现）；此处显式 --upx-dir 双保险确保 UPX 生效。
        run: uv run pyinstaller --noconfirm --clean --upx-dir "${{ runner.temp }}\upx\upx-4.2.4-win64" CADBatchAssistant.spec

      - name: Generate sha256 checksum
        # M9：为安装包生成 sha256 校验和资产（<hash>  文件名 格式），
        # 更新器下载后强校验，防止镜像/中间人篡改 exe。
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\CADBatchAssistant.exe").Hash.ToLower()
          "  $hash  CADBatchAssistant.exe" | Set-Content -NoNewline -Encoding ascii "dist\CADBatchAssistant.exe.sha256"
          Get-Content "dist\CADBatchAssistant.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CADBatchAssistant-exe
          path: dist/CADBatchAssistant.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>$null
          gh release create "${{ github.ref_name }}" "dist/CADBatchAssistant.exe" "dist/CADBatchAssistant.exe.sha256" --generate-notes --title "CADBatchAssistant ${{ github.ref_name }}"
