[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CADBatchAssistant"
version = "2.2.1"
description = "CAD批处理助手 —— 批量修改 DWG/DXF 图纸文字（正则替换）+ 数据表填图（模板占位）+ 图纸目录生成（标记模板取值）"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.4",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "tkinterdnd2>=0.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
